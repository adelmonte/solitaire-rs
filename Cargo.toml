[package]
name = "solitaire-rs"
version = "0.1.0"
edition = "2024"
description = "Windows 95 style Klondike solitaire as one static Wayland binary"
license = "GPL-3.0-or-later"
repository = "https://github.com/adelmonte/solitaire-rs"

[dependencies]
kbvm = "0.2.0"
libc = "0.2.191"
resvg = { version = "0.49.0", default-features = false, features = ["raster-images", "svgz"] }
smithay-client-toolkit = { version = "0.21", default-features = false }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
